spring:
  mongodb:
    username: ${MONGO_USER}
    password: ${MONGO_PASSWORD}
    host: localhost
    port: 27017
    authentication-database: admin
    database: notification

  kafka:
    consumer:
      bootstrap-servers: localhost:9092
      group-id: notificationGroup

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        spring.json.trusted.packages: com.nabgha.ecommerce.kafka.order,com.nabgha.ecommerce.kafka.payment
        spring.json.type.mapping: >-
          orderConfirmation:com.nabgha.ecommerce.kafka.order.OrderConfirmation,
          paymentConfirmation:com.nabgha.ecommerce.kafka.payment.PaymentConfirmation

      auto-offset-reset: earliest

  mail:
    host: localhost
    port: 1025
    username: ${MAIL_USER}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          trust: "*"
        auth: true
        starttls:
          enabled: true
        connectiontimeout: 5000
        timeout: 3000
        writetimeout: 5000

server:
  port: 8040